[project]
name = "claim-assistant"
version = "0.1.0"
description = "AI-powered automation tool that streamlines claim handling by replacing repetitive adjuster tasks (data collection, form filling, validation) with intelligent LLM-based assistants."
readme = "README.md"
authors = [
    { name = "Viacheslav Danilov", email = "viacheslav.v.danilov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=1.107.3",
    "pydantic-settings>=2.10.1",
]

[tool.uv]
default-groups = ["dev", "data", "ci"]

[dependency-groups]
ci = [
    "pre-commit>=4.3.0",
]
data = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
]
dev = [
    "joblib>=1.5.2",
    "mypy>=1.18.1",
    "python-dotenv>=1.1.1",
]

[tool.mypy]
install_types = true
no_strict_optional = true
ignore_missing_imports = true
explicit_package_bases = true

[project.scripts]
claim-assistant = "claim_assistant:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
