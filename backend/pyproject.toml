[project]
name = "claim-assistant"
version = "0.1.0"
description = "AI-powered automation tool that streamlines claim handling by replacing repetitive adjuster tasks (data collection, form filling, validation) with intelligent LLM-based assistants."
readme = "README.md"
authors = [
    { name = "Viacheslav Danilov", email = "viacheslav.v.danilov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fillpdf>=0.7.3",
    "numpy>=1.26.4",
    "openai>=2.3.0",
    "pydantic-settings>=2.10.1",
    "python-Levenshtein",
    "pyemd>=1.0.0",
    "reportlab>=4.4.4",
    "requests>=2.32.5",
    "pypdf2>=3.0.1",
    "matplotlib>=3.10.7",
    "azure-ai-documentintelligence",
    "azure-ai-formrecognizer>=3.3.3",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.22",
]

[tool.uv]
default-groups = ["data", "dev"]

[dependency-groups]
data = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
]
dev = [
    "agentic-doc>=0.3.3",
    "joblib>=1.5.2",
    "mypy>=1.18.1",
    "pre-commit>=4.5.1",
    "python-dotenv>=1.1.1",
]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
install_types = true
no_strict_optional = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.hatch.build.targets.wheel]
packages = ["src/claim_assistant"]

[tool.hatch.build.targets.sdist]
include = [
    "src/claim_assistant",
    "pyproject.toml",
    "README.md",
]

[project.scripts]
claim-assistant = "claim_assistant:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
